<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link rel="shortcut icon" href="{{url_for('static',filename='login.png')}}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <style>
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background-color: #f5f5f5;
    }
    .form-reset {
      max-width: 330px;
      padding: 15px;
    }
    .form-reset .form-floating:focus-within {
      z-index: 2;
    }
    .form-reset input[type="email"] {
      margin-bottom: 10px;
    }
  </style>
  <body class="text-center">
    <main class="form-reset w-100 m-auto">
      {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes ps-0 style-none">
        {% for message in messages %}
          <div class="alert alert-info alert-dismissible fade show" role="alert">
            <strong>{{message}}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
        </ul>
      {% endif %}
      {% endwith %}
      <form method="post" action="/reset-password" autocomplete="off">
        <img class="mb-4" src="{{url_for('static',filename='login.png')}}" alt="" width="100" height="100">
        <h1 class="h3 mb-3 fw-normal">Reset Password</h1>
        <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>

        <div class="form-floating">
          <input type="email" class="form-control" id="floatingInput" name="email" placeholder="name@example.com" required>
          <label for="floatingInput">Email address</label>
        </div>

        <button class="w-100 btn btn-lg btn-primary mt-2 mb-3" type="submit">Send Reset Email</button>
        <div>
          <a href="/login"><span>Back to Login</span></a>
        </div>
        <p class="mt-4 mb-3 text-muted"><a href="https://github.com/MBSA-INFINITY">MBSA</a> &copy; 2023 - 2024</p>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
